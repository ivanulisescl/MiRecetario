  <script>
(function () {
  'use strict';

  const APP_VERSION = '1.10.24';
  const STORAGE_KEY = 'mirecetario-recetas';
  const THEME_KEY = 'mirecetario-theme';
  const CATEGORY_VIEW_KEY = 'mirecetario-cat-view';
  const PLAN_STORAGE_KEY = 'mirecetario-plan-weeks';
  const PLAN_HIDDEN_KEY = 'mirecetario-plan-hidden';
  const PLAN_SERVER_CACHE_KEY = 'mirecetario-plan-server-cache';
  const GITHUB_TOKEN_STORAGE_KEY = 'mirecetarioGitHubToken';
  const GITHUB_REPO = 'ivanulisescl/MiRecetario';
  const state = {
    recipes: [],
    categories: [],
    searchQuery: '',
  };

  function showHeaderStatus(msg, isError) {
    try {
      var existing = document.getElementById('githubStatusToast');
      if (existing) existing.remove();
      var el = document.createElement('div');
      el.id = 'githubStatusToast';
      el.className = 'fixed left-1/2 -translate-x-1/2 bottom-4 z-50 px-4 py-2 rounded-lg shadow-lg text-sm ' +
        (isError ? 'bg-red-600 text-white' : 'bg-slate-900 text-white');
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, isError ? 6500 : 3500);
    } catch (e) {}
  }

  function bytesToBase64(bytes) {
    var bin = '';
    var chunk = 0x8000;
    for (var i = 0; i < bytes.length; i += chunk) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + chunk, bytes.length)));
    }
    return btoa(bin);
  }

  function githubContentsUrl(filename) {
    var path = String(filename).split('/').map(function (seg) { return encodeURIComponent(seg); }).join('/');
    return 'https://api.github.com/repos/' + GITHUB_REPO + '/contents/' + path;
  }

  function githubAuthHeaders(token) {
    return {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      'Content-Type': 'application/json'
    };
  }

  async function getGitHubToken() {
    var token = localStorage.getItem(GITHUB_TOKEN_STORAGE_KEY);
    if (!token || !token.trim()) {
      token = prompt('Introduce tu GitHub Personal Access Token (permiso repo):');
      if (!token || !token.trim()) return '';
      token = token.trim();
      localStorage.setItem(GITHUB_TOKEN_STORAGE_KEY, token);
    }
    return token.trim();
  }

  function githubRawUrl(src) {
    if (!src || /^(https?:|data:|blob:)/.test(src)) return '';
    return 'https://raw.githubusercontent.com/' + GITHUB_REPO + '/main/' + String(src).replace(/^\.\//, '');
  }

  /**
   * Sube un archivo al repositorio de GitHub vía Contents API.
   * @param {string} filename
   * @param {string|object|Uint8Array} content
   * @param {string} tokenStorageKey
   * @param {string} repo
   * @param {function} onStatus
   * @returns {Promise<boolean>} true si sube OK
   */
  async function uploadToGitHub(filename, content, tokenStorageKey, repo, onStatus) {
    let token = await getGitHubToken();
    if (!token) return false;
    if (onStatus) onStatus('Subiendo ' + filename + '...', false);
    try {
      var contentBase64;
      if (content instanceof Uint8Array) contentBase64 = bytesToBase64(content);
      else {
        var contentStr = typeof content === 'object' ? JSON.stringify(content, null, 2) : content;
        contentBase64 = btoa(unescape(encodeURIComponent(contentStr)));
      }
      const apiUrl = githubContentsUrl(filename);
      const headers = githubAuthHeaders(token);
      let sha = null;
      const getRes = await fetch(apiUrl, { headers });
      if (getRes.ok) {
        const getData = await getRes.json();
        sha = getData.sha;
      } else if (getRes.status !== 404) {
        const errData = await getRes.json().catch(() => ({}));
        if (getRes.status === 401) {
          localStorage.removeItem(tokenStorageKey);
          throw new Error('Token inválido o expirado. Configura uno nuevo.');
        }
        throw new Error(errData.message || `Error ${getRes.status}: ${getRes.statusText}`);
      }
      const putBody = {
        message: `Actualizar ${filename} (${new Date().toISOString().slice(0, 10)})`,
        content: contentBase64
      };
      if (sha) putBody.sha = sha;
      const putRes = await fetch(apiUrl, {
        method: 'PUT',
        headers,
        body: JSON.stringify(putBody)
      });
      if (!putRes.ok) {
        const errData = await putRes.json().catch(() => ({}));
        if (putRes.status === 401) {
          localStorage.removeItem(tokenStorageKey);
          throw new Error('Token inválido o expirado. Configura uno nuevo.');
        }
        throw new Error(errData.message || `Error ${putRes.status}: ${putRes.statusText}`);
      }
      if (onStatus) onStatus(`✅ ${filename} subido.`, false);
      return true;
    } catch (err) {
      if (onStatus) onStatus(`❌ ${err.message}`, true);
      return false;
    }
  }

  async function githubFileExists(filename) {
    var token = await getGitHubToken();
    if (!token) return null;
    var res = await fetch(githubContentsUrl(filename), { headers: githubAuthHeaders(token) });
    if (res.status === 404) return false;
    if (res.status === 401) {
      localStorage.removeItem(GITHUB_TOKEN_STORAGE_KEY);
      throw new Error('Token inválido o expirado. Configura uno nuevo.');
    }
    if (!res.ok) {
      var errData = await res.json().catch(function () { return {}; });
      throw new Error(errData.message || ('Error ' + res.status));
    }
    return true;
  }

  function slugifyTitle(title) {
    var s = (title || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    s = s.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    return s || 'receta';
  }

  function prepareRecipeImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var maxSide = 1600;
        var scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(function (blob) {
          URL.revokeObjectURL(url);
          if (!blob) { reject(new Error('No se pudo procesar la imagen.')); return; }
          blob.arrayBuffer().then(function (buf) { resolve(new Uint8Array(buf)); }).catch(reject);
        }, 'image/jpeg', 0.82);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('No se pudo leer la imagen. Usa JPG, PNG o WebP.'));
      };
      img.src = url;
    });
  }

  async function uniqueRecipeImagePath(slug, currentImage) {
    var used = {};
    state.recipes.forEach(function (r) {
      if (r.image && r.image !== currentImage) used[r.image] = true;
    });
    for (var n = 1; n < 40; n++) {
      var path = 'assets/img/recetas/' + slug + (n > 1 ? '-' + n : '') + '.jpg';
      if (path === currentImage) return path;
      if (used[path]) continue;
      var exists = await githubFileExists(path);
      if (exists === null) return '';
      if (!exists) return path;
    }
    return 'assets/img/recetas/' + slug + '-' + Date.now() + '.jpg';
  }

  function loadPlanWeeks() {
    try {
      var raw = localStorage.getItem(PLAN_STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function savePlanWeeks(weeks) {
    localStorage.setItem(PLAN_STORAGE_KEY, JSON.stringify(weeks));
  }

  function loadHiddenPlanIds() {
    try {
      var raw = localStorage.getItem(PLAN_HIDDEN_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function saveHiddenPlanIds(ids) {
    localStorage.setItem(PLAN_HIDDEN_KEY, JSON.stringify(ids));
  }

  function loadServerPlanningCache() {
    try {
      var raw = localStorage.getItem(PLAN_SERVER_CACHE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (data && Array.isArray(data.weeks)) return data;
    } catch (e) {}
    return null;
  }

  function saveServerPlanningCache(data) {
    try {
      if (data && Array.isArray(data.weeks)) {
        localStorage.setItem(PLAN_SERVER_CACHE_KEY, JSON.stringify(data));
      }
    } catch (e) {}
  }

  function getPlanningSeedData() {
    var cached = loadServerPlanningCache();
    if (cached && Array.isArray(cached.weeks)) return cached;
    var fallbackEl = document.getElementById('planning-fallback');
    if (fallbackEl && fallbackEl.textContent) {
      try {
        var fallbackData = JSON.parse(fallbackEl.textContent);
        if (fallbackData && Array.isArray(fallbackData.weeks)) return fallbackData;
      } catch (e) {}
    }
    return null;
  }

  function planWeekLabel(isoDate) {
    var d = new Date(isoDate + 'T12:00:00');
    var day = d.getDate();
    var months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    return day + ' ' + months[d.getMonth()];
  }

  function getAllPlanMeals() {

      (w.comidas || []).forEach(function (m) { if (m && m.trim()) meals.add(m.trim()); });
      (w.cenas || []).forEach(function (m) { if (m && m.trim()) meals.add(m.trim()); });

  const app = document.querySelector('#app');

  const placeholder = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360"><rect width="100%" height="100%" fill="#e2e8f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#334155" font-family="Inter,Arial" font-size="22">Imagen no disponible</text></svg>'
  );

  const CATEGORY_LABELS = {
    'de-cuchara': 'De cuchara', 'pures': 'Puré', 'sopas': 'Sopas', 'ensaladas': 'Ensaladas',
    'guisos': 'Guisos', 'pescados': 'Pescados', 'postres': 'Postres', 'varios': 'Varios', 'salado': 'Salado'
  };
  const CATEGORY_STORAGE_KEY = 'mirecetario-categories';
  const CATEGORY_DIRTY_KEY = 'mirecetario-categories-dirty';

  function escHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  }

  function isDefaultCategory(slug) {
    return Object.prototype.hasOwnProperty.call(CATEGORY_LABELS, slug);
  }

  function loadCategoryRecords() {
    var bySlug = new Map();
    Object.keys(CATEGORY_LABELS).forEach(function (slug) {
      bySlug.set(slug, { slug: slug, name: CATEGORY_LABELS[slug] });
    });
    var stored = [];
    try {
      var raw = localStorage.getItem(CATEGORY_STORAGE_KEY);
      if (raw) stored = JSON.parse(raw);
    } catch (e) { stored = []; }
    if (!Array.isArray(stored)) stored = [];
    stored.forEach(function (c) {
      if (!c || typeof c.slug !== 'string') return;
      var slug = c.slug.trim();
      var name = String(c.name || '').trim();
      if (!slug || !name) return;
      bySlug.set(slug, categoryRecord(slug, name, c.imageRev));
    });
    (state.recipes || []).forEach(function (r) {
      var slug = r.category || 'varios';
      if (!bySlug.has(slug)) bySlug.set(slug, { slug: slug, name: CATEGORY_LABELS[slug] || slug });
    });
    var list = [];
    Object.keys(CATEGORY_LABELS).forEach(function (slug) {
      if (bySlug.has(slug)) list.push(bySlug.get(slug));
    });
    bySlug.forEach(function (c, slug) {
      if (!isDefaultCategory(slug)) list.push(c);
    });
    return list;
  }

  function saveCategoryRecords(list) {
    writeCategoryRecords(list, true);
  }

  function categoryRecord(slug, name, imageRev) {
    var rec = { slug: slug, name: name };
    if (imageRev) rec.imageRev = String(imageRev);
    return rec;
  }

  function writeCategoryRecords(list, dirty) {
    localStorage.setItem(CATEGORY_STORAGE_KEY, JSON.stringify(list.map(function (c) {
      return categoryRecord(c.slug, c.name, c.imageRev);
    })));
    localStorage.setItem(CATEGORY_DIRTY_KEY, dirty ? '1' : '0');
  }

  function categoriesAreDirty() {
    if (localStorage.getItem(CATEGORY_DIRTY_KEY) === '1') return true;
    if (localStorage.getItem(CATEGORY_DIRTY_KEY) === null && localStorage.getItem(CATEGORY_STORAGE_KEY)) {
      localStorage.setItem(CATEGORY_DIRTY_KEY, '1');
      return true;
    }
    return false;
  }

  function parseCategoryFile(data) {
    if (!Array.isArray(data)) return null;
    var list = [];
    data.forEach(function (c) {
      if (!c || typeof c.slug !== 'string') return;
      var slug = c.slug.trim();
      var name = String(c.name || '').trim();
      if (!slug || !name) return;
      list.push(categoryRecord(slug, name, c.imageRev));
    });
    return list.length ? list : null;
  }

  function fetchAndApplyCategories() {
    if (categoriesAreDirty()) return Promise.resolve(false);
    return fetch('categories.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) return false;
      return r.json();
    }).then(function (data) {
      var list = parseCategoryFile(data);
      if (!list) return false;
      writeCategoryRecords(list, false);
      return true;
    }).catch(function () { return false; });
  }

  function categoryImagePath(slug) {
    return 'assets/img/categorias/' + slug + '.jpg';
  }

  function categoryImageUrl(c) {
    var path = categoryImagePath(c.slug);
    if (c.imageRev) return githubRawUrl(path) + '?v=' + encodeURIComponent(c.imageRev);
    return path;
  }

  async function uploadCategoryImage(slug, file) {
    var bytes = await prepareRecipeImage(file);
    var path = categoryImagePath(slug);
    var ok = await uploadToGitHub(path, bytes, GITHUB_TOKEN_STORAGE_KEY, GITHUB_REPO, showHeaderStatus);
    if (!ok) return false;
    var list = loadCategoryRecords();
    var found = false;
    list.forEach(function (c) {
      if (c.slug !== slug) return;
      c.imageRev = String(Date.now());
      found = true;
    });
    if (!found) return false;
    saveCategoryRecords(list);
    var okCats = await uploadToGitHub('categories.json', loadCategoryRecords(), GITHUB_TOKEN_STORAGE_KEY, GITHUB_REPO, showHeaderStatus);
    if (okCats) localStorage.setItem(CATEGORY_DIRTY_KEY, '0');
    loadRecipes();
    return true;
  }

  function categoryRecipeCount(slug) {
    return state.recipes.filter(function (r) { return (r.category || 'varios') === slug; }).length;
  }

  function categoryNameError(list, name, ignoreSlug) {
    var clean = String(name || '').trim();
    if (!clean) return 'Escribe un nombre.';
    var dup = list.some(function (c) {
      return c.slug !== ignoreSlug && c.name.toLowerCase() === clean.toLowerCase();
    });
    if (dup) return 'Ya hay una categoría con ese nombre.';
    return '';
  }

  function imgOrPlaceholder(src) {
    if (!src || src.trim() === '') return Promise.resolve(placeholder);
    function load(url, fallback) {
      return new Promise(function (resolve) {
        var i = new Image();
        i.onload = function () { resolve(url); };
        i.onerror = function () { resolve(fallback ? load(fallback, '') : placeholder); };
        i.src = url;
      });
    }
    return load(src, githubRawUrl(src));
  }

  function loadRecipes() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        state.recipes = JSON.parse(raw);
      } else {
        state.recipes = [];
      }
    } catch (e) {
      state.recipes = [];
    }
    var counts = {};
    state.recipes.forEach(function (r) {
      var slug = r.category || 'varios';
      counts[slug] = (counts[slug] || 0) + 1;
    });
    var records = loadCategoryRecords();
    var visible = state.recipes.length === 0
      ? records
      : records.filter(function (c) { return (counts[c.slug] || 0) > 0 || !isDefaultCategory(c.slug); });
    state.categories = visible.map(function (c) {
      return {
        slug: c.slug,
        name: c.name,
        img: categoryImageUrl(c)
      };
    });
    return state.recipes;
  }

  function saveRecipes() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.recipes));
    loadRecipes();
  }

  function buildPlanningJson() {
    var customWeeks = loadPlanWeeks();
    var hiddenIds = loadHiddenPlanIds();
    var seedData = getPlanningSeedData();
    var jsonWeeks = [];
    if (seedData && Array.isArray(seedData.weeks)) {
      jsonWeeks = seedData.weeks.filter(function (w) { return hiddenIds.indexOf(w.id) === -1; });
    }
    var allWeeks = customWeeks.concat(jsonWeeks);
    return {
      weekdays: ['L', 'M', 'X', 'J', 'V'],
      weekdayLabels: { L: 'Lunes', M: 'Martes', X: 'Miércoles', J: 'Jueves', V: 'Viernes' },
      weeks: allWeeks
    };
  }

    var a = document.createElement('a');

    }, 300);

    var catBlob = new Blob([catJson], { type: 'application/json' });

      var catA = document.createElement('a');
      catA.href = URL.createObjectURL(catBlob);
      catA.download = 'categories.json';
      catA.click();

  async function uploadRecipesAndPlanning() {
    loadRecipes();
    var okRecipes = await uploadToGitHub('recipes.json', state.recipes, GITHUB_TOKEN_STORAGE_KEY, GITHUB_REPO, showHeaderStatus);
    if (!okRecipes) return;
    var planData = buildPlanningJson();

    var okCategories = await uploadToGitHub('categories.json', loadCategoryRecords(), GITHUB_TOKEN_STORAGE_KEY, GITHUB_REPO, showHeaderStatus);
    if (okCategories) localStorage.setItem(CATEGORY_DIRTY_KEY, '0');

  function configureGitHubToken() {
    var current = (localStorage.getItem(GITHUB_TOKEN_STORAGE_KEY) || '').trim();
    var currentHint = current ? ' (ya hay uno guardado)' : ' (no hay token guardado)';
    var val = prompt('Pega tu GitHub Personal Access Token (permiso repo).\nDeja vacío para borrar el token.' + currentHint, '');
    if (val === null) return;
    val = String(val).trim();
    if (!val) {
      localStorage.removeItem(GITHUB_TOKEN_STORAGE_KEY);
      showHeaderStatus('Token de GitHub borrado.', false);
      return;
    }
    localStorage.setItem(GITHUB_TOKEN_STORAGE_KEY, val);
    showHeaderStatus('Token de GitHub guardado.', false);
  }

  function resetRecipes() {
    if (!confirm('¿Restaurar recetas, plan y categorías desde el servidor? Se sustituirán por recipes.json, planning.json y categories.json.')) return;
    savePlanWeeks([]);
    saveHiddenPlanIds([]);
    localStorage.setItem(CATEGORY_DIRTY_KEY, '0');
    fetch('recipes.json?t=' + Date.now()).then(function (r) { return r.ok ? r.json() : []; }).then(function (data) {
      var arr = Array.isArray(data) ? data : (data.recipes || []);
      state.recipes = arr.length > 0 ? arr : [];
      saveRecipes();
      return fetchAndApplyCategories();
    }).then(function () {
      location.hash = '#/';
      render();
      alert('Recetas, plan y categorías restaurados desde el servidor.');
    }).catch(function () {
      alert('No se pudo cargar recipes.json. Comprueba la conexión o la URL.');
    });
  }

  function forceUpdate() {
    if (!confirm('¿Actualizar la aplicación a la última versión? Se recargará la página.')) return;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }).then(function () {
        return caches.keys ? caches.keys().then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); }) : Promise.resolve();
      }).then(function () {
        window.location.reload(true);
      });
    } else {
      window.location.reload(true);
    }
  }

  function applyImportedRecipes(text) {
    var data = JSON.parse(text);
    var arr = Array.isArray(data) ? data : (data.recipes || []);
    var map = new Map(state.recipes.map(function (r) { return [String(r.id), r]; }));
    var added = 0, updated = 0;
    arr.forEach(function (r) {
      var id = String(r.id);
      if (map.has(id)) { map.set(id, r); updated++; } else { map.set(id, r); added++; }
    });
    state.recipes = Array.from(map.values());
    return { added: added, updated: updated };
  }

  function nextId() {
    if (state.recipes.length === 0) return 1;
    return Math.max.apply(null, state.recipes.map(function (r) { return Number(r.id) || 0; })) + 1;
  }

  function formatRecipeForShare(rec) {
    var lines = [];
    lines.push(rec.title || 'Sin título');
    lines.push('');
    if (rec.description && rec.description.trim()) {
      lines.push(rec.description.trim());
      lines.push('');
    }
    lines.push('Ingredientes:');
    (rec.ingredients || []).forEach(function (i) { lines.push('- ' + i); });
    lines.push('');
    lines.push('Elaboración:');
    (rec.steps || []).forEach(function (s, idx) { lines.push((idx + 1) + '. ' + s); });
    return lines.join('\n');
  }

  function pdfFileName(rec) {
    var base = String(rec.title || 'receta').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, ' ').trim();
    return (base || 'receta') + '.pdf';
  }

  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function shareFilePayload(blob, filename, title, text) {
    var file = new File([blob], filename, { type: 'application/pdf' });
    return { files: [file], title: title || 'Receta', text: text || title || 'Receta' };
  }

  function chooseSharePayload(blob, filename, title, text) {
    var filePayload = shareFilePayload(blob, filename, title, text);
    var textPayload = { title: title || 'Receta', text: text || title || 'Receta' };
    if (typeof navigator.share !== 'function') return null;
    if (!navigator.canShare) return filePayload;
    try {
      if (navigator.canShare(filePayload)) return filePayload;
      if (navigator.canShare(textPayload)) return textPayload;
    } catch (e) {}
    return textPayload;
  }

  function openExternalShare(blob, filename, title, text) {
    var root = document.getElementById('shareReady');
    if (!root) return;
    var box = root.querySelector('[data-share-box]');
    if (!box) return;
    var message = (title ? title + '\n\n' : '') + (text || '');
    box.innerHTML = '<h2 id="shareReadyTitle" class="text-lg font-semibold">Enviar receta</h2>' +
      '<p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Elige WhatsApp o el correo. Descargar solo guarda el PDF.</p>' +
      '<div class="mt-4 flex flex-col gap-2">' +
      '<button type="button" data-share-wa class="px-4 py-2.5 rounded-lg bg-[#25D366] text-white font-semibold">WhatsApp</button>' +
      '<button type="button" data-share-mail class="px-4 py-2.5 rounded-lg bg-brand text-white font-semibold">Correo</button>' +
      '<button type="button" data-share-dl class="px-4 py-2.5 rounded-lg bg-slate-200 dark:bg-slate-700">Descargar PDF</button>' +
      '</div>';
    box.querySelector('[data-share-wa]').addEventListener('click', function () {
      window.open('https://wa.me/?text=' + encodeURIComponent(message), '_blank', 'noopener');
      root.remove();
    });
    box.querySelector('[data-share-mail]').addEventListener('click', function () {
      window.open('mailto:?subject=' + encodeURIComponent(title || 'Receta') + '&body=' + encodeURIComponent(message), '_blank', 'noopener');
      root.remove();
    });
    box.querySelector('[data-share-dl]').addEventListener('click', function () {
      downloadBlob(blob, filename);
      root.remove();
    });
  }

  function openShareReady(blob, filename, title, text) {
    var old = document.getElementById('shareReady');
    if (old) old.remove();
    var root = document.createElement('div');
    root.id = 'shareReady';
    root.className = 'fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40 p-4';
    root.innerHTML = '<div data-share-box class="w-full max-w-sm rounded-2xl bg-white dark:bg-slate-800 p-5 shadow-xl" role="dialog" aria-labelledby="shareReadyTitle">' +
      '<h2 id="shareReadyTitle" class="text-lg font-semibold">PDF listo</h2>' +
      '<p class="mt-1 text-sm text-slate-600 dark:text-slate-300">Compartir abre WhatsApp, el correo u otras apps. Descargar solo guarda el archivo.</p>' +
      '<div class="mt-4 flex gap-2">' +
      '<button type="button" data-share-go class="flex-1 px-4 py-2.5 rounded-lg bg-brand text-white font-semibold">Compartir</button>' +
      '<button type="button" data-share-dl class="px-4 py-2.5 rounded-lg bg-slate-200 dark:bg-slate-700">Descargar</button>' +
      '</div></div>';
    document.body.appendChild(root);
    function close() { if (root.parentNode) root.remove(); }
    root.addEventListener('click', function (e) { if (e.target === root) close(); });
    root.querySelector('[data-share-dl]').addEventListener('click', function () {
      downloadBlob(blob, filename);
      close();
    });
    root.querySelector('[data-share-go]').addEventListener('click', function () {
      var payload = chooseSharePayload(blob, filename, title, text);
      if (!payload || typeof navigator.share !== 'function') {
        openExternalShare(blob, filename, title, text);
        return;
      }
      navigator.share(payload).catch(function (err) {
        if (err && err.name === 'AbortError') return;
        openExternalShare(blob, filename, title, text);
      });
    });
  }

  function shareRecipe(id) {
    var rec = state.recipes.find(function (x) { return String(x.id) === String(id); });
    if (!rec || shareRecipe.busy) return;
    shareRecipe.busy = true;
    showHeaderStatus('Preparando el PDF…', false);
    var filename = pdfFileName(rec);
    var title = rec.title || 'Receta';
    var text = formatRecipeForShare(rec);
    generateRecipePdf(rec).then(function (blob) {
      openShareReady(blob, filename, title, text);
    }).catch(function (err) {
      showHeaderStatus((err && err.message) || 'No se pudo preparar el PDF.', true);
    }).then(function () {
      shareRecipe.busy = false;
    });
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      if (window.showShareFeedback) window.showShareFeedback(); else alert('Receta copiada.');
    } catch (e) {
      alert('No se pudo copiar. Copia manualmente:\n\n' + text.slice(0, 200) + '…');
    }
    document.body.removeChild(ta);
  }

  function formatWeekForShare(w, dayLabels) {
    var days = ['L', 'M', 'X', 'J', 'V'];
    var lines = ['Semana del ' + (w.label || w.id || ''), ''];
    (w.comidas || []).forEach(function (c, i) { lines.push((dayLabels[days[i]] || days[i]) + ' - Comida: ' + (c || '-')); });
    (w.cenas || []).forEach(function (c, i) { lines.push((dayLabels[days[i]] || days[i]) + ' - Cena: ' + (c || '-')); });
    return lines.join('\n');
  }

  function wrapText(ctx, text, maxWidth, indent) {
    indent = indent || 0;
    var words = text.split(' ');
    var lines = [];
    var currentLine = '';
    words.forEach(function (word) {
      var testLine = currentLine + (currentLine ? ' ' : '') + word;
      var metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth - indent && currentLine) {
        lines.push(currentLine);
        currentLine = word;
      } else {
        currentLine = testLine;
      }
    });
    if (currentLine) lines.push(currentLine);
    return lines;
  }

  function loadShareImage(src) {
    if (!src) return Promise.resolve(null);
    var urls = [src];
    var raw = githubRawUrl(src);
    if (raw) urls.push(raw);
    function tryOne(i) {
      if (i >= urls.length) return Promise.resolve(null);
      return fetch(urls[i]).then(function (res) {
        if (!res.ok) throw new Error('no');
        return res.blob();
      }).then(function (blob) {
        if (typeof createImageBitmap === 'function') return createImageBitmap(blob);
        return new Promise(function (resolve) {
          var img = new Image();
          var url = URL.createObjectURL(blob);
          img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
          img.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
          img.src = url;
        });
      }).catch(function () { return tryOne(i + 1); });
    }
    return tryOne(0);
  }

  function pdfWrap(ctx, text, maxWidth) {
    var words = String(text || '').split(/\s+/).filter(Boolean);
    var lines = [];
    var line = '';
    words.forEach(function (word) {
      if (ctx.measureText(word).width > maxWidth) {
        if (line) { lines.push(line); line = ''; }
        var chunk = '';
        word.split('').forEach(function (ch) {
          if (ctx.measureText(chunk + ch).width > maxWidth && chunk) {
            lines.push(chunk);
            chunk = ch;
          } else chunk += ch;
        });
        line = chunk;
        return;
      }
      var test = line ? line + ' ' + word : word;
      if (line && ctx.measureText(test).width > maxWidth) {
        lines.push(line);
        line = word;
      } else line = test;
    });
    if (line) lines.push(line);
    return lines.length ? lines : [''];
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    var radius = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function pdfBytes(text) {
    var out = new Uint8Array(text.length);
    for (var i = 0; i < text.length; i++) out[i] = text.charCodeAt(i) & 255;
    return out;
  }

  function concatBytes(parts) {
    var len = 0;
    parts.forEach(function (p) { len += p.length; });
    var out = new Uint8Array(len);
    var offset = 0;
    parts.forEach(function (p) { out.set(p, offset); offset += p.length; });
    return out;
  }

  function buildJpegPdf(jpegs, width, height) {
    var pageW = 595.28;
    var pageH = 841.89;
    var parts = [];
    var size = 0;
    function push(bytes) { parts.push(bytes); size += bytes.length; }
    function pushStr(text) { push(pdfBytes(text)); }
    var offsets = [];
    var n = jpegs.length;
    var pagesId = 2;
    var pageIds = [];
    var contentIds = [];
    var imageIds = [];
    var next = 3;
    for (var i = 0; i < n; i++) {
      pageIds.push(next++);
      contentIds.push(next++);
      imageIds.push(next++);
    }
    var total = next;
    function startObj(id) {
      offsets[id] = size;
      pushStr(id + ' 0 obj\n');
    }
    pushStr('%PDF-1.4\n');
    startObj(1);
    pushStr('<< /Type /Catalog /Pages ' + pagesId + ' 0 R >>\nendobj\n');
    startObj(pagesId);
    pushStr('<< /Type /Pages /Kids [' + pageIds.map(function (id) { return id + ' 0 R'; }).join(' ') + '] /Count ' + n + ' >>\nendobj\n');
    var content = 'q\n' + pageW + ' 0 0 ' + pageH + ' 0 0 cm\n/Im0 Do\nQ\n';
    for (var p = 0; p < n; p++) {
      startObj(pageIds[p]);
      pushStr('<< /Type /Page /Parent ' + pagesId + ' 0 R /MediaBox [0 0 ' + pageW + ' ' + pageH + '] /Contents ' + contentIds[p] + ' 0 R /Resources << /XObject << /Im0 ' + imageIds[p] + ' 0 R >> >> >>\nendobj\n');
      startObj(contentIds[p]);
      pushStr('<< /Length ' + content.length + ' >>\nstream\n' + content + 'endstream\nendobj\n');
      startObj(imageIds[p]);
      pushStr('<< /Type /XObject /Subtype /Image /Width ' + width + ' /Height ' + height + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpegs[p].length + ' >>\nstream\n');
      push(jpegs[p]);
      pushStr('\nendstream\nendobj\n');
    }
    var xref = size;
    pushStr('xref\n0 ' + total + '\n');
    pushStr('0000000000 65535 f \n');
    for (var id = 1; id < total; id++) {
      var off = String(offsets[id] || 0);
      while (off.length < 10) off = '0' + off;
      pushStr(off + ' 00000 n \n');
    }
    pushStr('trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF');
    return new Blob([concatBytes(parts)], { type: 'application/pdf' });
  }

  function canvasToJpeg(canvas) {
    return new Promise(function (resolve, reject) {
      canvas.toBlob(function (blob) {
        if (!blob) { reject(new Error('No se pudo crear el PDF.')); return; }
        blob.arrayBuffer().then(function (buf) { resolve(new Uint8Array(buf)); }).catch(reject);
      }, 'image/jpeg', 0.88);
    });
  }

  async function generateRecipePdf(rec) {
    if (document.fonts && document.fonts.load) {
      try {
        await document.fonts.load('700 64px Inter');
        await document.fonts.load('400 28px Inter');
      } catch (e) {}
    }
    var photo = null;
    try { photo = await loadShareImage(rec.image || ''); } catch (e) { photo = null; }

    var W = 1240;
    var H = 1754;
    var margin = 80;
    var contentW = W - margin * 2;
    var bottom = H - 96;
    var pages = [];
    var ctx = null;
    var y = 0;
    var title = rec.title || 'Sin título';

    function newPage(continued) {
      var canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f7f8fa';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#0ea5e9';
      ctx.fillRect(0, 0, W, 16);
      y = 64;
      if (continued) {
        ctx.fillStyle = '#64748b';
        ctx.font = '600 26px Inter, sans-serif';
        var head = title;
        while (head.length > 3 && ctx.measureText(head).width > contentW) head = head.slice(0, -2);
        if (head !== title) head = head.slice(0, -1) + '…';
        ctx.fillText(head, margin, y + 28);
        y += 52;
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(margin, y);
        ctx.lineTo(W - margin, y);
        ctx.stroke();
        y += 36;
      }
      pages.push(canvas);
    }

    function ensure(height) {
      if (y + height > bottom) newPage(true);
    }

    newPage(false);
    ctx.fillStyle = '#0369a1';
    ctx.font = '700 22px Inter, sans-serif';
    ctx.fillText('MI RECETARIO', margin, y + 8);
    y += 48;
    ctx.fillStyle = '#0f172a';
    ctx.font = '700 58px Inter, sans-serif';
    pdfWrap(ctx, title, contentW).forEach(function (line) {
      ensure(72);
      ctx.font = '700 58px Inter, sans-serif';
      ctx.fillStyle = '#0f172a';
      ctx.fillText(line, margin, y + 52);
      y += 70;
    });
    if (rec.description && String(rec.description).trim()) {
      y += 8;
      ctx.font = '400 28px Inter, sans-serif';
      pdfWrap(ctx, String(rec.description).trim(), contentW).slice(0, 3).forEach(function (line) {
        ensure(40);
        ctx.font = '400 28px Inter, sans-serif';
        ctx.fillStyle = '#64748b';
        ctx.fillText(line, margin, y + 28);
        y += 38;
      });
    }
    y += 28;

    if (photo && photo.width && photo.height) {
      var photoH = 520;
      ensure(photoH + 12);
      var ix = margin;
      var iy = y;
      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.08)';
      roundRectPath(ctx, ix, iy + 8, contentW, photoH, 28);
      ctx.fill();
      ctx.restore();
      ctx.save();
      roundRectPath(ctx, ix, iy, contentW, photoH, 28);
      ctx.clip();
      var ir = photo.width / photo.height;
      var box = contentW / photoH;
      var sx = 0;
      var sy = 0;
      var sw = photo.width;
      var sh = photo.height;
      if (ir > box) {
        sw = photo.height * box;
        sx = (photo.width - sw) / 2;
      } else {
        sh = photo.width / box;
        sy = (photo.height - sh) / 2;
      }
      ctx.drawImage(photo, sx, sy, sw, sh, ix, iy, contentW, photoH);
      ctx.restore();
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 2;
      roundRectPath(ctx, ix, iy, contentW, photoH, 28);
      ctx.stroke();
      y += photoH + 40;
    }

    function drawSection(label) {
      ensure(88);
      y += 8;
      ctx.fillStyle = '#0ea5e9';
      roundRectPath(ctx, margin, y + 6, 8, 28, 4);
      ctx.fill();
      ctx.fillStyle = '#0369a1';
      ctx.font = '700 24px Inter, sans-serif';
      ctx.fillText(label, margin + 22, y + 30);
      y += 56;
    }

    function drawRows(items, numbered) {
      var list = items && items.length ? items : [numbered ? 'Sin pasos.' : 'Sin ingredientes.'];
      var lineH = 42;
      list.forEach(function (item, index) {
        ctx.font = '400 28px Inter, sans-serif';
        var textX = margin + (numbered ? 68 : 36);
        var lines = pdfWrap(ctx, item, W - margin - textX);
        lines.forEach(function (line, lineIndex) {
          ensure(lineH + 6);
          if (lineIndex === 0 && numbered) {
            ctx.fillStyle = '#0ea5e9';
            ctx.beginPath();
            ctx.arc(margin + 22, y + 16, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            var num = String(index + 1);
            ctx.font = num.length > 1 ? '700 18px Inter, sans-serif' : '700 22px Inter, sans-serif';
            ctx.fillText(num, margin + 22 - ctx.measureText(num).width / 2, y + 24);
          } else if (lineIndex === 0) {
            ctx.fillStyle = '#0ea5e9';
            ctx.beginPath();
            ctx.arc(margin + 10, y + 16, 6, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.font = '400 28px Inter, sans-serif';
          ctx.fillStyle = '#0f172a';
          ctx.fillText(line, textX, y + 26);
          y += lineH;
        });
        y += 8;
      });
    }

    drawSection('INGREDIENTES');
    drawRows(rec.ingredients || [], false);
    y += 16;
    drawSection('ELABORACIÓN');
    drawRows(rec.steps || [], true);

    pages.forEach(function (canvas, index) {
      var c = canvas.getContext('2d');
      c.fillStyle = '#94a3b8';
      c.font = '400 22px Inter, sans-serif';
      c.fillText('Mi Recetario', margin, H - 46);
      var label = (index + 1) + ' / ' + pages.length;
      c.fillText(label, W - margin - c.measureText(label).width, H - 46);
    });

    var jpegs = [];
    for (var i = 0; i < pages.length; i++) jpegs.push(await canvasToJpeg(pages[i]));
    return buildJpegPdf(jpegs, W, H);
  }

  function generateWeekImage(w, dayLabels) {
    return new Promise(function (resolve, reject) {
      try {
        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d');
        var padding = 40;
        var lineHeight = 28;
        var titleSize = 32;
        var daySize = 20;
        var textSize = 18;
        var maxWidth = 900;
        canvas.width = maxWidth;
        var x = padding;
        var y = padding;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0ea5e9';
        ctx.fillRect(0, 0, canvas.width, 8);
        ctx.fillStyle = '#1e293b';
        ctx.font = 'bold ' + titleSize + 'px Inter, sans-serif';
        var title = formatWeekTitlePlain(w.id, w.label);
        ctx.fillText(title, x, y);
        y += lineHeight + 30;
        var days = ['L', 'M', 'X', 'J', 'V'];
        var dayNames = days.map(function (d) { return dayLabels[d] || d; });
        var colWidth = (maxWidth - 2 * padding) / 3;
        ctx.fillStyle = '#0ea5e9';
        ctx.font = 'bold ' + daySize + 'px Inter, sans-serif';
        ctx.fillText('Día', x, y);
        ctx.fillText('Comida', x + colWidth, y);
        ctx.fillText('Cena', x + colWidth * 2, y);
        y += lineHeight + 15;
        ctx.fillStyle = '#1e293b';
        ctx.font = textSize + 'px Inter, sans-serif';
        days.forEach(function (d, i) {
          var dayName = dayNames[i];
          var comida = (w.comidas && w.comidas[i]) || '-';
          var cena = (w.cenas && w.cenas[i]) || '-';
          var dayY = y;
          ctx.fillStyle = '#64748b';
          ctx.font = 'bold ' + daySize + 'px Inter, sans-serif';
          ctx.fillText(dayName, x, dayY);
          ctx.fillStyle = '#1e293b';
          ctx.font = textSize + 'px Inter, sans-serif';
          var comidaLines = wrapText(ctx, comida, colWidth - 20);
          var cenaLines = wrapText(ctx, cena, colWidth - 20);
          var maxLines = Math.max(comidaLines.length, cenaLines.length, 1);
          comidaLines.forEach(function (line, idx) {
            ctx.fillText(line, x + colWidth, dayY + idx * lineHeight);
          });
          cenaLines.forEach(function (line, idx) {
            ctx.fillText(line, x + colWidth * 2, dayY + idx * lineHeight);
          });
          y += maxLines * lineHeight + 20;
        });
        canvas.height = y + padding;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#0ea5e9';
        ctx.fillRect(0, 0, canvas.width, 8);
        y = padding;
        ctx.fillStyle = '#1e293b';
        ctx.font = 'bold ' + titleSize + 'px Inter, sans-serif';
        ctx.fillText(title, x, y);
        y += lineHeight + 30;
        ctx.fillStyle = '#0ea5e9';
        ctx.font = 'bold ' + daySize + 'px Inter, sans-serif';
        ctx.fillText('Día', x, y);
        ctx.fillText('Comida', x + colWidth, y);
        ctx.fillText('Cena', x + colWidth * 2, y);
        y += lineHeight + 15;
        ctx.fillStyle = '#1e293b';
        ctx.font = textSize + 'px Inter, sans-serif';
        days.forEach(function (d, i) {
          var dayName2 = dayNames[i];
          var comida2 = (w.comidas && w.comidas[i]) || '-';
          var cena2 = (w.cenas && w.cenas[i]) || '-';
          var dayY2 = y;
          ctx.fillStyle = '#64748b';
          ctx.font = 'bold ' + daySize + 'px Inter, sans-serif';
          ctx.fillText(dayName2, x, dayY2);
          ctx.fillStyle = '#1e293b';
          ctx.font = textSize + 'px Inter, sans-serif';
          var comidaLines2 = wrapText(ctx, comida2, colWidth - 20);
          var cenaLines2 = wrapText(ctx, cena2, colWidth - 20);
          var maxLines2 = Math.max(comidaLines2.length, cenaLines2.length, 1);
          comidaLines2.forEach(function (line, idx) {
            ctx.fillText(line, x + colWidth, dayY2 + idx * lineHeight);
          });
          cenaLines2.forEach(function (line, idx) {
            ctx.fillText(line, x + colWidth * 2, dayY2 + idx * lineHeight);
          });
          y += maxLines2 * lineHeight + 20;
        });
        canvas.toBlob(function (blob) {
          if (blob) resolve(blob); else reject(new Error('Error generando imagen'));
        }, 'image/png');
      } catch (e) {
        reject(e);
      }
    });
  }

  function route() {
    var h = location.hash || '#/';
    var p = h.slice(2).split('/').filter(Boolean);

    if (p[0] === 'categoria' && p[1]) return { n: 'cat', slug: p[1] };
    if (p[0] === 'receta' && p[1]) return { n: 'rec', id: p[1] };
    if (p[0] === 'nueva') return { n: 'form', id: null };
    if (p[0] === 'editar' && p[1]) return { n: 'form', id: p[1] };
    if (p[0] === 'plan' && p[1] === 'propuesta') return { n: 'planPropuesta' };
    if (p[0] === 'plan' && p[1] === 'nueva') return { n: 'planNueva' };
    if (p[0] === 'plan' && p[1] === 'editar' && p[2]) return { n: 'planEditar', id: p[2] };
    if (p[0] === 'plan') return { n: 'plan' };
    if (p[0] === 'importar') return { n: 'importar' };
    if (p[0] === 'categorias') return { n: 'categorias' };

    if (r.n === 'rec') return renderRec(r.id);

  var recipeSpeakToken = 0;
  var recipeSpeaking = false;

  function spanishVoice() {
    if (!window.speechSynthesis) return null;
    var voices = speechSynthesis.getVoices() || [];
    var es = voices.filter(function (v) { return (v.lang || '').toLowerCase().indexOf('es') === 0; });
    return es.filter(function (v) { return /es-ES/i.test(v.lang); })[0] || es[0] || null;
  }

  function setSpeakButton(on) {
    var btn = document.getElementById('btnLeer');
    if (!btn) return;
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.title = on ? 'Detener lectura' : 'Leer receta';
    btn.setAttribute('aria-label', btn.title);
    btn.classList.toggle('bg-brand', on);
    btn.classList.toggle('text-white', on);
    btn.classList.toggle('hover:bg-brand-dark', on);
    btn.classList.toggle('bg-slate-200', !on);
    btn.classList.toggle('dark:bg-slate-800', !on);
    btn.classList.toggle('text-slate-700', !on);
    btn.classList.toggle('dark:text-slate-200', !on);
  }

  function clearSpeakingStep() {
    document.querySelectorAll('.step-speaking').forEach(function (el) { el.classList.remove('step-speaking'); });
  }

  function stopRecipeSpeech() {
    recipeSpeakToken++;
    recipeSpeaking = false;
    if (window.speechSynthesis && (speechSynthesis.speaking || speechSynthesis.pending)) {
      window.speechSynthesis.cancel();
    }
    setSpeakButton(false);
    clearSpeakingStep();
  }

  function speakRecipe(r) {
    if (!window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') {
      alert('Este navegador no puede leer en voz alta.');
      return;
    }
    var restart = recipeSpeaking || speechSynthesis.speaking || speechSynthesis.pending;
    stopRecipeSpeech();
    var token = recipeSpeakToken;
    recipeSpeaking = true;
    setSpeakButton(true);
    var queue = [];
    queue.push({ text: r.title || 'Receta' });
    if (r.description) queue.push({ text: r.description });
    var ing = (r.ingredients || []).filter(Boolean);
    if (ing.length) {
      queue.push({ text: 'Ingredientes.' });
      ing.forEach(function (item) { queue.push({ text: item }); });
    }
    var steps = (r.steps || []).filter(Boolean);
    if (steps.length) {
      queue.push({ text: 'Elaboración.' });
      steps.forEach(function (step, i) { queue.push({ text: 'Paso ' + (i + 1) + '. ' + step, stepIndex: i }); });
    }
    function finish() {
      if (token !== recipeSpeakToken) return;
      recipeSpeaking = false;
      setSpeakButton(false);
      clearSpeakingStep();
    }
    function run(i) {
      if (token !== recipeSpeakToken) return;
      if (i >= queue.length) return finish();
      clearSpeakingStep();
      var item = queue[i];
      if (item.stepIndex != null) {
        var input = app.querySelector('input[data-step="' + item.stepIndex + '"]');
        var row = input && input.closest('li');
        if (row) {
          row.classList.add('step-speaking');
          row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }
      var u = new SpeechSynthesisUtterance(item.text);
      u.lang = 'es-ES';
      var voice = spanishVoice();
      if (voice) u.voice = voice;
      u.onend = function () { run(i + 1); };
      u.onerror = function (ev) {
        if (token !== recipeSpeakToken) return;
        if (ev && ev.error === 'interrupted') return;
        finish();
      };
      speechSynthesis.speak(u);
    }
    if (restart) setTimeout(function () { run(0); }, 80);
    else run(0);
  }

        var done = Array.from(checks).filter(function (c) { return c.checked; }).length;

        var currentLi = null;

  function generateMealProposals(mode) {
    var allWeeks = [];
    var customWeeks = loadPlanWeeks();
    allWeeks = allWeeks.concat(customWeeks);
    var hiddenIds = loadHiddenPlanIds();
    var seedData = getPlanningSeedData();
    if (seedData && Array.isArray(seedData.weeks)) {
      var serverWeeks = seedData.weeks.filter(function (w) { return hiddenIds.indexOf(w.id) === -1; });
      allWeeks = allWeeks.concat(serverWeeks);
    }
    allWeeks = allWeeks.filter(function (w) { return w && w.comidas && Array.isArray(w.comidas) && w.cenas && Array.isArray(w.cenas); });
    if (allWeeks.length === 0) return { comidas: ['', '', '', '', ''], cenas: ['', '', '', '', ''] };
    var proposalsComidas = ['', '', '', '', ''];
    var proposalsCenas = ['', '', '', '', ''];
    var weeksToAnalyze = allWeeks;
    if (mode === 'recent') {
      var sortedWeeks = allWeeks.slice().sort(function (a, b) {
        var aId = String(a.id || '');
        var bId = String(b.id || '');
        if (/^\d{4}-\d{2}-\d{2}$/.test(aId) && /^\d{4}-\d{2}-\d{2}$/.test(bId)) {
          return bId.localeCompare(aId);
        }
        return 0;
      });
      weeksToAnalyze = sortedWeeks.slice(0, 3);
    }
    var dayMeals = [{}, {}, {}, {}, {}];
    var dayDinners = [{}, {}, {}, {}, {}];
    weeksToAnalyze.forEach(function (w) {
      var comidas = w.comidas || [];
      var cenas = w.cenas || [];
      comidas.forEach(function (m, i) {
        if (i < 5 && m && m.trim()) {
          if (!dayMeals[i][m.trim()]) dayMeals[i][m.trim()] = 0;
          dayMeals[i][m.trim()]++;
        }
      });
      cenas.forEach(function (m, i) {
        if (i < 5 && m && m.trim()) {
          if (!dayDinners[i][m.trim()]) dayDinners[i][m.trim()] = 0;
          dayDinners[i][m.trim()]++;
        }
      });
    });
    dayMeals.forEach(function (meals, dayIdx) {
      var sorted = Object.keys(meals).map(function (m) { return { meal: m, count: meals[m] }; }).sort(function (a, b) { return b.count - a.count; });
      if (sorted.length > 0) proposalsComidas[dayIdx] = sorted[0].meal;
    });
    dayDinners.forEach(function (dinners, dayIdx) {
      var sorted = Object.keys(dinners).map(function (m) { return { meal: m, count: dinners[m] }; }).sort(function (a, b) { return b.count - a.count; });
      if (sorted.length > 0) proposalsCenas[dayIdx] = sorted[0].meal;
    });
    return { comidas: proposalsComidas, cenas: proposalsCenas };
  }

      '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>' +
      '</div></div>' +
      '<form id="formPlanEditar" class="p-4 rounded-xl border bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 space-y-4">' +
      '<div><label class="block text-sm font-medium mb-1">Inicio de semana (lunes)</label>' +
      '<input type="date" name="fecha" value="' + dateStr + '" required class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800"/></div>' +
      datalistHtml +
      '<div class="overflow-x-auto"><table class="w-full"><thead><tr><th class="px-2 py-2 text-left text-sm font-medium text-slate-500 dark:text-slate-400">Día</th><th class="px-2 py-2 text-left text-sm font-medium text-slate-500 dark:text-slate-400">Comida</th><th class="px-2 py-2 text-left text-sm font-medium text-slate-500 dark:text-slate-400">Cena</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="flex gap-2"><button type="submit" class="px-4 py-2 rounded-lg bg-brand text-white hover:bg-brand-dark">Guardar</button><a href="#/plan" class="px-4 py-2 rounded-lg bg-slate-200 dark:bg-slate-700">Cancelar</a></div>' +
      '</form></section>';
    app.querySelector('#formPlanEditar').addEventListener('submit', function (e) {
      e.preventDefault();
      var form = e.target;
      var fecha = (form.fecha.value || '').trim();
      if (!fecha) return;
      var comidas = [];
      var cenas = [];
      for (var i = 0; i < 5; i++) {
        comidas.push((form['comida' + i].value || '').trim());
        cenas.push((form['cena' + i].value || '').trim());
      }
      var label = planWeekLabel(fecha);
      var updated = weeks.filter(function (x) { return x.id !== id; });
      if (fecha !== id && updated.some(function (x) { return x.id === fecha; })) {
        if (!confirm('Ya existe una semana con esa fecha. ¿Sustituirla?')) return;
        updated = updated.filter(function (x) { return x.id !== fecha; });
      }
      updated.push({ id: fecha, label: label, comidas: comidas, cenas: cenas });
      savePlanWeeks(updated);
      location.hash = '#/plan';
      render();
    });
  }

  function renderImportar() {
    app.innerHTML = '<section class="max-w-2xl space-y-6">' +
      '<h1 class="text-2xl font-bold">Importar recetas desde JSON</h1>' +
      '<p class="text-slate-600 dark:text-slate-400">Selecciona un archivo <code class="bg-slate-200 dark:bg-slate-700 px-1 rounded">recipes.json</code> (array de recetas). Se fusionarán con las actuales; si una receta tiene el mismo <code class="bg-slate-200 dark:bg-slate-700 px-1 rounded">id</code>, se actualizará.</p>' +
      '<div class="flex flex-wrap gap-2">' +
      '<input type="file" id="fileJson" accept=".json,application/json" class="block w-full text-sm"/>' +
      '<a href="#/" class="inline-flex w-9 h-9 items-center justify-center rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-700" title="Volver al inicio">' +
      '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>' +
      '</div>' +
      '<div id="importResult" class="hidden p-3 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm"></div></section>';

    app.querySelector('#fileJson').addEventListener('change', function (e) {
      var f = e.target.files[0];
      var res = app.querySelector('#importResult');
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var result = applyImportedRecipes(reader.result);
          saveRecipes();
          res.textContent = 'Importado: ' + result.added + ' nuevas, ' + result.updated + ' actualizadas. Total: ' + state.recipes.length + ' recetas.';
          res.classList.remove('hidden');
        } catch (err) {
          res.textContent = 'Error: ' + err.message;
          res.classList.remove('hidden');
        }
      };
      reader.readAsText(f);
    });
  }

  function render404() {
    app.innerHTML = '<div class="space-y-4"><h1 class="text-2xl font-bold">Página no encontrada</h1><a href="#/" class="inline-flex w-9 h-9 items-center justify-center rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-700" title="Ir al inicio">' +
      '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a></div>';
  }

  window.addEventListener('hashchange', render);
  window.addEventListener('load', function () {
    render();
    var hadRecipes = state.recipes.length > 0;
    var recipesReady = hadRecipes
      ? Promise.resolve()
      : fetch('recipes.json').then(function (r) { return r.ok ? r.json() : []; }).then(function (data) {
          var arr = Array.isArray(data) ? data : (data.recipes || []);
          if (arr.length > 0) {
            state.recipes = arr;
            saveRecipes();
          }
        }).catch(function () {});
    Promise.all([recipesReady, fetchAndApplyCategories()]).then(function (results) {
      if (results[1] || (!hadRecipes && state.recipes.length > 0)) render();
    });
  });

  function closeOperacionesMenu() {
    var menu = document.getElementById('operacionesMenu');
    var btn = document.getElementById('btnOperaciones');
    if (menu) menu.classList.add('hidden');
    if (btn) btn.setAttribute('aria-expanded', 'false');
  }

  document.getElementById('btnOperaciones').addEventListener('click', function (e) {
    e.stopPropagation();
    var menu = document.getElementById('operacionesMenu');
    var btn = document.getElementById('btnOperaciones');
    if (!menu || !btn) return;
    var isOpen = !menu.classList.contains('hidden');
    if (isOpen) { menu.classList.add('hidden'); btn.setAttribute('aria-expanded', 'false'); }
    else { menu.classList.remove('hidden'); btn.setAttribute('aria-expanded', 'true'); }
  });

  document.addEventListener('click', function (e) {
    var menu = document.getElementById('operacionesMenu');
    var wrap = document.getElementById('operacionesWrap');
    if (menu && menu.contains(e.target)) closeOperacionesMenu();
    if (wrap && !wrap.contains(e.target)) closeOperacionesMenu();
    var id = e.target && e.target.id;
    if (id === 'btnExportar') { e.preventDefault(); closeOperacionesMenu(); exportRecipes(); }
    if (id === 'btnImportar') {
      e.preventDefault();
      closeOperacionesMenu();
      var input = document.getElementById('headerImportFile');
      if (input) input.click();
    }
    if (id === 'btnSubirGitHub') { e.preventDefault(); closeOperacionesMenu(); uploadRecipesAndPlanning(); }
    if (id === 'btnConfigTokenGitHub') { e.preventDefault(); closeOperacionesMenu(); configureGitHubToken(); }
    if (id === 'btnResetear') { e.preventDefault(); closeOperacionesMenu(); resetRecipes(); }
    if (id === 'btnActualizar') { e.preventDefault(); closeOperacionesMenu(); forceUpdate(); }
    var shareBtn = e.target && (e.target.closest && e.target.closest('[data-share-id]'));
    if (shareBtn) {
      e.preventDefault();
      shareRecipe(shareBtn.getAttribute('data-share-id'));
    }
    var planBtn = e.target && (e.target.closest && e.target.closest('[data-plan-action]'));
    if (planBtn) {
      e.preventDefault();
      var weekId = planBtn.getAttribute('data-week-id');
      var action = planBtn.getAttribute('data-plan-action');
      var w = window.__planWeeksMap && weekId && window.__planWeeksMap[weekId];
      var labels = window.__planDayLabels || { L: 'Lunes', M: 'Martes', X: 'Miércoles', J: 'Jueves', V: 'Viernes' };
      if (w && action === 'share') {
        generateWeekImage(w, labels).then(function (blob) {
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          var weekTitle = (w.label || w.id || 'semana').replace(/[^a-z0-9]/gi, '_').toLowerCase();
          a.download = weekTitle + '.png';
          a.click();
          setTimeout(function () {
            URL.revokeObjectURL(url);
            if (navigator.clipboard && navigator.clipboard.write) {
              blob.arrayBuffer().then(function (buffer) {
                return navigator.clipboard.write([
                  new ClipboardItem({ 'image/png': new Blob([buffer], { type: 'image/png' }) })
                ]);
              }).then(function () {
                alert('Imagen descargada y copiada al portapapeles.');
              }).catch(function () {
                alert('Imagen descargada. No se pudo copiar al portapapeles.');
              });
            } else {
              alert('Imagen descargada.');
            }
          }, 100);
        }).catch(function (err) {
          console.error('Error generando imagen:', err);
          var text = formatWeekForShare(w, labels);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { alert('No se pudo generar la imagen. Texto copiado al portapapeles.'); }).catch(function () { fallbackCopy(text); });
          } else { fallbackCopy(text); }
        });
      }
      if (action === 'edit') {
        if (!w && window.__planWeeksMap && weekId) {
          w = window.__planWeeksMap[weekId];
        }
        if (w) {
          try { sessionStorage.setItem('planEditWeek', JSON.stringify({ id: weekId, w: w })); } catch (e) {}
          location.hash = '#/plan/editar/' + encodeURIComponent(weekId);
          render();
        } else {
          alert('No se pudo cargar la semana. Recarga la página e inténtalo de nuevo.');
        }
      }
      if (w && action === 'delete') {
        if (!confirm('¿Eliminar esta semana del plan?')) return;
        if (/^\d{4}-\d{2}-\d{2}$/.test(String(weekId))) {
          var weeks = loadPlanWeeks().filter(function (x) { return x.id !== weekId; });
          savePlanWeeks(weeks);
        } else {
          var hidden = loadHiddenPlanIds();
          if (hidden.indexOf(weekId) === -1) hidden.push(weekId);
          saveHiddenPlanIds(hidden);
        }
        location.hash = '#/plan';
        render();
      }
    }
    var deleteBtn = e.target && (e.target.closest && e.target.closest('[data-delete-id]'));
    if (deleteBtn) {
      e.preventDefault();
      var recId = deleteBtn.getAttribute('data-delete-id');
      var rec = state.recipes.find(function (x) { return String(x.id) === String(recId); });
      if (!rec) return;
      if (!confirm("¿Eliminar la receta \"" + (rec.title || '').replace(/"/g, '\\"') + "\"?")) return;
      state.recipes = state.recipes.filter(function (x) { return String(x.id) !== String(recId); });
      saveRecipes();
      render();
    }
  });

  var searchInput = document.getElementById('searchInput');
  if (searchInput) {
    searchInput.addEventListener('input', function () {
      state.searchQuery = searchInput.value.trim();
      render();
    });
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { searchInput.value = ''; state.searchQuery = ''; searchInput.blur(); render(); }
    });
  }

  document.getElementById('btnPlanSemanal').addEventListener('click', function (e) {
    e.preventDefault();
    location.hash = isPlanRoute() ? '#/' : '#/plan';
  });

  document.getElementById('btnDarkMode').addEventListener('click', function () {
    var root = document.documentElement;
    var isDark = root.classList.contains('dark');
    if (isDark) {
      root.classList.remove('dark');
      localStorage.setItem(THEME_KEY, 'light');
    } else {
      root.classList.add('dark');
      localStorage.setItem(THEME_KEY, 'dark');
    }
  });

  var headerImportFile = document.getElementById('headerImportFile');
  if (headerImportFile) {
    headerImportFile.addEventListener('change', function (e) {
      var f = e.target.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        try {
          applyImportedRecipes(reader.result);
          saveRecipes();
          location.hash = '#/';
          render();
        } catch (err) {
          alert('Error al importar: ' + err.message);
        }
        headerImportFile.value = '';
      };
      reader.readAsText(f);
    });
  }

  var versionEl = document.getElementById('appVersion');
  if (versionEl) versionEl.textContent = 'v' + APP_VERSION;
})();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
